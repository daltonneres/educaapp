<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Educa+ Centro Educacional</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="imgs/logoeduca.jpeg" type="image/jpeg" />
<link rel="shortcut icon" href="imgs/logoeduca.jpeg" />
</head>
<body>
<div id="app"></div>
<!-- PDF.js: usado só pra ler o texto de dentro de um PDF (na Gestão > Professores > Importar turmas),
     direto no navegador, sem mandar o arquivo pra nenhum servidor. Carregado antes do script.js. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Tesseract.js: OCR (reconhecimento de texto em imagem) rodando no navegador. Só é usado quando o
     PDF é escaneado (sem texto selecionável) — na Gestão > Contratos > Importar. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<!-- jsQR: decodifica o QR Code do Pix quando o PDF do boleto só traz a imagem (sem o texto copia e cola).
     Usado na Financeiro > Lançar cobrança. Também roda só no navegador. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
